name: Publish book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; never cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # All code blocks in the book are display-only (baked #> output),
      # so the render needs no R toolchain — Quarto alone rebuilds the HTML.
      - name: Render book to HTML
        run: quarto render --to html

      # One-time setup: Pages must be enabled by a repo admin under
      # Settings -> Pages -> Source: "GitHub Actions". The workflow token
      # cannot create the Pages site itself (requires admin permissions).
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
