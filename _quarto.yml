project:
  type: book

book:
  title: "Statistics for Football Scouting"
  subtitle: "A football-scouting adaptation of Introduction to Modern Statistics"
  author: "Adapted from Çetinkaya-Rundel & Hardin's IMS for the recruitment analyst"
  chapters:
    - index.qmd
    - part: "Introduction to data"
      chapters:
        - 01-data-hello.qmd
        - 02-data-design.qmd
        - 03-data-applications.qmd
    - part: "Exploratory data analysis"
      chapters:
        - 04-explore-categorical.qmd
        - 05-explore-numerical.qmd
        - 06-explore-applications.qmd
    - part: "Regression modeling"
      chapters:
        - 07-model-slr.qmd
        - 08-model-mlr.qmd
        - 09-model-logistic.qmd
        - 10-model-applications.qmd
    - part: "Foundations of inference"
      chapters:
        - 11-foundations-randomization.qmd
        - 12-foundations-bootstrapping.qmd
        - 13-foundations-mathematical.qmd
        - 14-foundations-errors.qmd
        - 15-foundations-applications.qmd
    - part: "Statistical inference"
      chapters:
        - 16-inference-one-prop.qmd
        - 17-inference-two-props.qmd
        - 18-inference-tables.qmd
        - 19-inference-one-mean.qmd
        - 20-inference-two-means.qmd
        - 21-inference-paired-means.qmd
        - 22-inference-many-means.qmd
        - 23-inference-applications.qmd
    - part: "Inferential modeling"
      chapters:
        - 24-inf-model-slr.qmd
        - 25-inf-model-mlr.qmd
        - 26-inf-model-logistic.qmd
        - 27-inf-model-applications.qmd
  appendices:
    - A1-appendix-setup.qmd
    - A2-exercise-solutions.qmd
    - A3-appendix-even-answers.qmd
    - A4-appendix-reference.qmd
    - A5-appendix-further.qmd
    - A6-appendix-dependence.qmd

format:
  html:
    theme: cosmo
    toc: true
  pdf:
    documentclass: scrbook

license: "CC BY-SA 4.0"
